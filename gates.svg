<?xml version="1.0" encoding="utf-8"?>
<!-- Every symbol is half the size of the original drawings, with short leads and one
     terminal per lead. Gates and the flip-flop have an 84 x 65 footprint: their art is in
     the old 260 x 130 drawing units, cropped to x 44..212 and scaled by 0.5. Switches,
     pulsers, lamps and the clock are 40 x 65 with the terminal at the top; the HIGH and
     GND terminals are 40 x 30. Pin positions are listed in gateLibrary.js and must match. -->
<svg xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .outline { fill: #f8f6ef; stroke: #202525; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
            .detail { fill: none; stroke: #202525; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
            .pin { stroke: #225a69; stroke-width: 5; stroke-linecap: round; }
            .terminal { fill: #f8f6ef; stroke: #225a69; stroke-width: 5; }

            /* Controls are drawn in board units, so their strokes are already half width. */
            .c-pin { stroke: #225a69; stroke-width: 2.5; stroke-linecap: round; }
            .c-terminal { fill: #f8f6ef; stroke: #225a69; stroke-width: 2.5; }
            .legend { fill: #d8e0e7; font-family: sans-serif; font-size: 7.5px; font-weight: 700; }

            /* H-500 rocker switches (tan) and pulser keys (white). The pressed half is darker. */
            .rocker-frame { fill: #14171a; stroke: #0a0b0c; stroke-width: 2; }
            .rocker { fill: #e2a93a; }
            .rocker-pressed { fill: #9c6f1a; }
            .pulser-key { fill: #f4f2ea; }

            /* H-500 indicator lamps: dark bezel + red jeweled lens. */
            .lamp-bezel { fill: #1c1f22; stroke: #0a0b0c; stroke-width: 3; }
            .lamp-lens-off { fill: #5a2422; }
            .lamp-lens-on { fill: #ff3b30; filter: drop-shadow(0 0 5px #ff6b60); }
            .knob-mark { fill: none; stroke: #d8e0e7; stroke-width: 2.5; stroke-linecap: round; }
        </style>

        <symbol id="and" viewBox="0 0 84 65">
            <g transform="translate(-22 0) scale(0.5)">
                <line class="pin" x1="58" y1="42" x2="76" y2="42" />
