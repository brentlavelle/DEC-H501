<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .outline { fill: #f8f6ef; stroke: #202525; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
            .detail { fill: none; stroke: #202525; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
            .pin { stroke: #225a69; stroke-width: 5; stroke-linecap: round; }
            .terminal { fill: #f8f6ef; stroke: #225a69; stroke-width: 5; }

            /* H-500 panel toggle switches: chrome bezel + red lever, like the real unit. */
            .switch-bezel { fill: #d7dbe0; stroke: #4a4f57; stroke-width: 4; }
            .switch-lever { fill: none; stroke: #b3211f; stroke-width: 8; stroke-linecap: round; }

            /* H-500 indicator lamps: dark bezel + red jeweled lens. */
            .lamp-bezel { fill: #1c1f22; stroke: #0a0b0c; stroke-width: 6; }
            .lamp-lens-off { fill: #5a2422; }
            .lamp-lens-on { fill: #ff3b30; filter: drop-shadow(0 0 10px #ff6b60); }
        </style>

        <symbol id="and" viewBox="0 0 260 130">
