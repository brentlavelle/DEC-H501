                <path class="outline" d="M76 22h42a43 43 0 0 1 0 86H76z" />
                <line class="pin" x1="161" y1="65" x2="198" y2="65" />
                <circle class="terminal" cx="58" cy="42" r="7" />
                <circle class="terminal" cx="58" cy="88" r="7" />
                <circle class="terminal" cx="198" cy="65" r="7" />
            </g>
        </symbol>

